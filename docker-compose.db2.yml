services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: playwright-db2
    privileged: true
    ports:
      - '50000:50000'
    environment:
      LICENSE: accept
      DB2INSTANCE: db2inst1
      DB2INST1_PASSWORD: password
      DBNAME: testdb
      BLU: 'false'
      ENABLE_ORACLE_COMPATIBILITY: 'false'
      UPDATEAVAIL: 'NO'
      TO_CREATE_SAMPLEDB: 'true'
      REPODB: 'false'
      PERSISTENT_HOME: 'true'
      HADR_ENABLED: 'false'
    volumes:
      - db2-data:/database

volumes:
  db2-data:
