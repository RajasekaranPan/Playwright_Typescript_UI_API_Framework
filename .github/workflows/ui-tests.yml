name: UI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ui-tests:
    name: Run UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Load Infisical secrets
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: dda74f33-1690-4391-b15b-fe2eff455218
          domain: https://app.infisical.com
          env-slug: qa
          project-slug: playwright-automation-1d-oy

      - name: Run UI Tests
        run: npx playwright test tests/ui-tests

      - name: Upload UI Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: test-results/
          retention-days: 7