name: API Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken();
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
            console.log('Repository:', payload.repository);
            console.log('Repository ID:', payload.repository_id);
            console.log('Repository owner:', payload.repository_owner);
            console.log('Repository owner ID:', payload.repository_owner_id);
            console.log('Event:', payload.event_name);
            console.log('Ref:', payload.ref);
            
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Load Infisical secrets
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: dda74f33-1690-4391-b15b-fe2eff455218
          domain: https://app.infisical.com
          env-slug: qa
          project-slug: playwright-github-actions

      - name: Run API Tests
        run: npx playwright test tests/apiTests

      - name: Upload API Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: test-results/
          retention-days: 7